const $=id=>document.getElementById(id);let flashIndex=0,quizMode='',queue=[],current=null,timerId=null,timeLeft=0,feedbackLock=false,wrongCounts={},totalMistakes=0,answeredCount=0;const iconSpeaker='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 9a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';function speakerMarkup(label='听发音'){return `${iconSpeaker}<span>${label}</span>`}['frontSpeak','backSpeak','quizSpeak'].forEach(id=>$(id).innerHTML=speakerMarkup());$('homeWordCount').textContent=WORDS.length;
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function speak(i){const w=WORDS[i];if(!w)return;if(!('speechSynthesis'in window)){toast('此浏览器暂不支持语音朗读');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.word);u.lang='en-GB';u.rate=.86;window.speechSynthesis.speak(u)}
function renderFlash(){const w=WORDS[flashIndex];$('frontImg').src=w.img;$('backImg').src=w.img;$('frontImg').alt=w.word+' 图片';$('backImg').alt=w.word+' 图片';$('backWord').textContent=w.word;$('backIpa').textContent=w.ipa;$('backMeaning').textContent=w.meaning;$('flashProgress').textContent=`第 ${flashIndex+1} / ${WORDS.length} 个词`;$('flashProgressFill').style.width=`${(flashIndex+1)/WORDS.length*100}%`;$('prevWord').disabled=flashIndex===0;$('nextWord').disabled=flashIndex===WORDS.length-1;$('flashCard').classList.remove('flipped');$('wordStrip').innerHTML='';WORDS.forEach((x,i)=>{const b=document.createElement('button');b.className='word-chip'+(i===flashIndex?' current':'');b.textContent=x.word;b.addEventListener('click',()=>{flashIndex=i;renderFlash();document.querySelector('.flash-stage').scrollIntoView({behavior:'smooth',block:'center'})});$('wordStrip').appendChild(b)})}function openLearn(){flashIndex=0;renderFlash();showView('flashView')}function openModes(){showView('modeView')}function shuffled(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startQuiz(mode){quizMode=mode;wrongCounts={};totalMistakes=0;answeredCount=0;queue=shuffled(WORDS.map((_,i)=>i));$('quizModeTitle').textContent=mode==='meaning-spelling'?'根据拼写选含义':mode==='meaning-audio'?'根据发音选含义':'拼写填空';showView('quizView');nextQuestion()}
function nextQuestion(){clearInterval(timerId);feedbackLock=false;if(!queue.length){finishQuiz();return}current=queue.shift();answeredCount++;document.querySelectorAll('.choice-btn,.unsure-btn,#submitSpelling,#forgetBtn,#spellingInput').forEach(e=>e.disabled=false);const w=WORDS[current],isChoice=quizMode!=='spelling';$('feedback').textContent='';$('feedback').className='feedback';$('quizProgress').textContent=`已练习 ${answeredCount} 次 · 剩余待掌握 ${new Set(queue.concat(current)).size} 个`;$('quizProgressFill').style.width=`${Math.max(3,(WORDS.length-new Set(queue).size)/WORDS.length*100)}%`;$('quizRoundLabel').textContent=`第 ${answeredCount} 题`;$('quizIpa').textContent=quizMode==='meaning-spelling'?'':w.ipa;$('quizSpeak').style.display=quizMode==='meaning-audio'||quizMode==='spelling'?'inline-flex':'none';$('quizSpeak').innerHTML=speakerMarkup('再听一次');$('choiceGrid').innerHTML='';$('choiceGrid').style.display=isChoice?'grid':'none';$('spellingBox').style.display=quizMode==='spelling'?'flex':'none';$('forgetBtn').style.display=quizMode==='spelling'?'inline-block':'none';$('quizKicker').textContent=quizMode==='meaning-audio'?'听音后选择中文含义':quizMode==='meaning-spelling'?'选择这个单词的中文含义':'听发音，并根据首字母拼写';if(quizMode==='meaning-spelling')$('quizPrompt').textContent=w.word;else if(quizMode==='meaning-audio')$('quizPrompt').textContent='听一听，这是什么词？';else{$('quizPrompt').textContent=w.word[0].toUpperCase()+' · · ·';$('spellingInput').value=''}if(isChoice){const distractors=shuffled(WORDS.filter((_,i)=>i!==current).map(x=>x.meaning));shuffled([w.meaning,...distractors.slice(0,3)]).forEach(text=>{const b=document.createElement('button');b.className='choice-btn';b.textContent=text;b.onclick=()=>answerChoice(b,text===w.meaning);$('choiceGrid').appendChild(b)});const u=document.createElement('button');u.className='unsure-btn';u.textContent='我不确定';u.onclick=()=>answerChoice(u,false);$('choiceGrid').appendChild(u)}const secs=quizMode==='spelling'?20:7;startTimer(secs);if(quizMode!=='meaning-spelling')setTimeout(()=>{if(!feedbackLock&&current!==null)speak(current)},280);if(quizMode==='spelling')setTimeout(()=>$('spellingInput').focus({preventScroll:true}),50)}
function startTimer(total){clearInterval(timerId);timeLeft=total;paintTimer(total);timerId=setInterval(()=>{timeLeft--;paintTimer(total);if(timeLeft<=0){clearInterval(timerId);if(quizMode==='spelling')answerSpelling(false,true);else answerChoice(null,false,true)}},1000)}function paintTimer(total){$('timerNumber').textContent=timeLeft;$('timerText').textContent=timeLeft+' 秒';$('timerRing').style.setProperty('--progress',`${Math.max(0,timeLeft/total*100)}%`);$('timerRing').style.background=`conic-gradient(${timeLeft<=3?'#d96775':'#cf7290'} ${Math.max(0,timeLeft/total*100)}%,#f2e1e7 0)`}function recordWrong(){wrongCounts[current]=(wrongCounts[current]||0)+1;totalMistakes++}function feedback(correct,message){if(feedbackLock)return;feedbackLock=true;clearInterval(timerId);$('feedback').textContent=correct?'答对了，继续加油！':message||`再记一记：${WORDS[current].word} — ${WORDS[current].meaning}`;$('feedback').className='feedback '+(correct?'good':'bad');if(!correct){recordWrong();queue.push(current)}document.querySelectorAll('.choice-btn,.unsure-btn,#submitSpelling,#forgetBtn,#spellingInput').forEach(e=>e.disabled=true);setTimeout(()=>{if($('quizView').classList.contains('active'))nextQuestion()},correct?650:1050)}function answerChoice(btn,correct,timeout=false){if(feedbackLock)return;if(correct){btn?.classList.add('correct');feedback(true)}else{document.querySelectorAll('.choice-btn').forEach(b=>{if(b.textContent===WORDS[current].meaning)b.classList.add('correct')});if(btn&&!btn.classList.contains('unsure-btn'))btn.classList.add('wrong');feedback(false,timeout?'时间到！正确含义是：'+WORDS[current].meaning:undefined)}}function normalize(s){return s.toLowerCase().trim().replace(/[’‘`]/g,"'").replace(/[^a-z']/g,'')}function answerSpelling(forget=false,timeout=false){if(feedbackLock)return;const w=WORDS[current],correct=!forget&&normalize($('spellingInput').value)===normalize(w.word);feedback(correct,correct?undefined:forget?'记住这个词：正确拼写：'+w.word:timeout?'时间到！正确拼写：'+w.word:'正确拼写：'+w.word)}
function finishQuiz(){clearInterval(timerId);window.speechSynthesis?.cancel();const perfect=totalMistakes===0;$('resultSub').textContent=perfect?'通过率100%，perfect！':totalMistakes<=2?'近乎完美，太棒啦！':'所有词汇都已掌握，继续保持！';$('resultErrors').textContent='错误次数：'+totalMistakes;$('resultWords').textContent=`掌握词汇：${WORDS.length} / ${WORDS.length}`;renderErrors();showView('resultView');celebrate(perfect)}function renderErrors(){const entries=Object.entries(wrongCounts).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);if(!entries.length){$('errorTableArea').innerHTML='<div class="no-errors">本轮没有错题，完美掌握！</div>';return}const box=document.createElement('div');box.className='table-wrap';box.innerHTML='<table class="error-table"><thead><tr><th>单词</th><th>音标</th><th>含义</th><th>本轮错误次数</th></tr></thead><tbody></tbody></table>';entries.forEach(([i,n])=>{const w=WORDS[+i],tr=document.createElement('tr');[w.word,w.ipa,w.meaning,String(n)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.appendChild(td)});box.querySelector('tbody').appendChild(tr)});$('errorTableArea').replaceChildren(box)}function exportErrors(){const entries=Object.entries(wrongCounts).filter(([,n])=>n>0);if(!entries.length){toast('本轮没有错题需要导出');return}const rows=[['单词','音标','含义','本轮错误次数'],...entries.map(([i,n])=>{const w=WORDS[+i];return[w.word,w.ipa,w.meaning,n]})];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='Power_Up_3_Unit_4_错题记录.csv';a.click();URL.revokeObjectURL(url)}function celebrate(perfect){const root=$('celebrate');root.innerHTML='';const colors=['#f3a9bd','#ffd36f','#9dd8bd','#b6c8f4','#dcafe7','#ffb48b'];for(let i=0;i<100;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.setProperty('--dur',2.4+Math.random()*2.4+'s');e.style.setProperty('--dx',-120+Math.random()*240+'px');e.style.setProperty('--rot',Math.random()*180+'deg');e.style.setProperty('--color',colors[i%colors.length]);e.style.animationDelay=Math.random()*.8+'s';root.appendChild(e)}if(perfect)for(let i=0;i<22;i++){const s=document.createElement('span');s.className='sparkle';s.textContent='✦';s.style.left=5+Math.random()*90+'%';s.style.top=18+Math.random()*65+'%';root.appendChild(s)}setTimeout(()=>root.innerHTML='',6500)}function scatterHomeDots(){const home=$('homeView'),colors=['#ffbd59','#a8dcff','#ff9cb4','#b8e8a6','#c6b2ff'];home.querySelectorAll('.dopamine-dot').forEach(x=>x.remove());for(let i=0;i<(innerWidth<720?22:34);i++){const d=document.createElement('i');d.className='dopamine-dot';d.style.setProperty('--x',2+Math.random()*96+'%');d.style.setProperty('--y',2+Math.random()*96+'%');d.style.setProperty('--size',5+Math.random()*11+'px');d.style.setProperty('--dot-color',colors[Math.floor(Math.random()*colors.length)]);d.style.setProperty('--alpha',.55+Math.random()*.35);d.style.setProperty('--duration',2.1+Math.random()*4.3+'s');d.style.setProperty('--delay',-Math.random()*5+'s');d.style.setProperty('--hop-x',-18+Math.random()*36+'px');d.style.setProperty('--hop-y',8+Math.random()*24+'px');d.style.setProperty('--land-x',-12+Math.random()*24+'px');home.querySelector('.home').appendChild(d)}}scatterHomeDots();window.addEventListener('resize',()=>setTimeout(scatterHomeDots,220));
$('learnBtn').onclick=openLearn;$('checkBtn').onclick=openModes;$('homeBtn').onclick=()=>{clearInterval(timerId);window.speechSynthesis?.cancel();showView('homeView')};$('modeBack').onclick=()=>showView('homeView');$('flashTestBtn').onclick=openModes;$('prevWord').onclick=()=>{if(flashIndex>0){flashIndex--;renderFlash()}};$('nextWord').onclick=()=>{if(flashIndex<WORDS.length-1){flashIndex++;renderFlash()}};$('flashCard').onclick=e=>{if(!e.target.closest('button'))$('flashCard').classList.toggle('flipped')};$('flashCard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('flashCard').classList.toggle('flipped')}};$('frontSpeak').onclick=e=>{e.stopPropagation();speak(flashIndex)};$('backSpeak').onclick=e=>{e.stopPropagation();speak(flashIndex)};$('quizSpeak').onclick=()=>speak(current);document.querySelectorAll('.mode-card').forEach(b=>b.onclick=()=>startQuiz(b.dataset.mode));$('submitSpelling').onclick=()=>answerSpelling();$('spellingInput').onkeydown=e=>{if(e.key==='Enter')answerSpelling()};$('forgetBtn').onclick=()=>answerSpelling(true);$('quitQuiz').onclick=()=>{clearInterval(timerId);window.speechSynthesis?.cancel();showView('modeView')};$('againBtn').onclick=openModes;$('resultHomeBtn').onclick=()=>showView('homeView');$('exportBtn').onclick=exportErrors;
</script></body></html>
